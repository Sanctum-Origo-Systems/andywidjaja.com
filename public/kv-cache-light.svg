path d="M672 148 V106" fill="none" stroke="#656d76" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3" marker-end="url(#a-sub)"/><text x="390.0" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">each step reads the weights + the whole cache</text><text x="390.0" y="224.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">inter-token latency (ITL): ~6 to 9 ms per token,</text><text x="390.0" y="242.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">every token, in order</text><text x="390.0" y="270.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#9a6700" text-anchor="start">cost: N tokens × ITL = the wall clock</text></svg>
